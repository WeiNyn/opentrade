version: '3.8'

services:
  # Streaming klines service - main application
  streaming-klines:
    image: opentrade/opentrade-pipeline:0.1
    container_name: opentrade-streaming-klines
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      KLINE_SYMBOL: ${KLINE_SYMBOL:-BTCUSDT}
      KLINE_INTERVAL: ${KLINE_INTERVAL:-1m}
      DATABASE_URL: postgres://postgres:password@opentrade-timescaledb:5432/postgres
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
    command: [ "/app/streaming_klines" ]
    networks:
      - opentrade-network
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f streaming_klines" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backfill service - optional, can be run manually
  backfill-klines:
    image: opentrade/opentrade-pipeline:0.1
    container_name: opentrade-backfill-klines
    depends_on:
      timescaledb:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:password@opentrade-timescaledb:5432/postgres
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
    command: [ "/app/backfill_klines", "-s", "BTCUSDT", "-f", "600", "-i", "1m" ]
    networks:
      - opentrade-network

# Networks
networks:
  opentrade-network:
    driver: bridge
    name: opentrade-network
